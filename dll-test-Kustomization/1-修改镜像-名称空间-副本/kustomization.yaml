# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 声明我们要对哪些基础资源进行加工
resources:
  - deployment.yaml

# 实战特性 1：批量修改镜像
images:
  - name: gcr.io/google-samples/gb-frontend
    newTag: v2.0.0

# 实战特性 2：修改副本数
replicas:
  - name: guestbook-ui
    count: 3

# 修改名称空间
namespace: test